apiVersion: v1
kind: Namespace
metadata:
  name: gopoli
---
apiVersion: v1
kind: Secret
metadata:
  name: gopoli-secrets
  namespace: gopoli
type: Opaque
stringData:
  POSTGRES_PASSWORD: gopoli
  GOPOLI_JWT_SECRET: gopoli-k8s-secret-solo-para-entornos-locales
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: gopoli
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-gopoli
  namespace: gopoli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-gopoli
  template:
    metadata:
      labels:
        app: db-gopoli
    spec:
      containers:
        - name: postgres
          image: ghcr.io/gopoli/gopoli-db:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gopoli
            - name: POSTGRES_USER
              value: gopoli
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U gopoli -d gopoli"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: db-gopoli
  namespace: gopoli
spec:
  selector:
    app: db-gopoli
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gopoli
  namespace: gopoli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gopoli
  template:
    metadata:
      labels:
        app: api-gopoli
    spec:
      containers:
        - name: api
          image: ghcr.io/gopoli/gopoli-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db-gopoli:5432/gopoli
            - name: SPRING_DATASOURCE_USERNAME
              value: gopoli
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: POSTGRES_PASSWORD
            - name: GOPOLI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: GOPOLI_JWT_SECRET
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_JPA_FORMAT_SQL
              value: "false"
          readinessProbe:
            httpGet:
              path: /carreras
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gopoli
  namespace: gopoli
spec:
  selector:
    app: api-gopoli
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gopoli
  namespace: gopoli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-gopoli
  template:
    metadata:
      labels:
        app: web-gopoli
    spec:
      containers:
        - name: web
          image: ghcr.io/gopoli/gopoli-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://localhost:8080
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-gopoli
  namespace: gopoli
spec:
  selector:
    app: web-gopoli
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
