apiVersion: v1
kind: Namespace
metadata:
  name: gopoli
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: gopoli-secrets
  namespace: gopoli
type: Opaque
stringData:
  POSTGRES_PASSWORD: gopoli-k8s-local
  GOPOLI_JWT_SECRET: gopoli-k8s-secret-solo-para-entornos-locales
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gopoli-config
  namespace: gopoli
data:
  POSTGRES_DB: gopoli
  POSTGRES_USER: gopoli
  GOPOLI_SEED_DEMO: "true"
  SPRING_DATASOURCE_URL: jdbc:postgresql://db-gopoli:5432/gopoli
  SPRING_DATASOURCE_USERNAME: gopoli
  APP_TIMEZONE: America/Bogota
  CORS_ALLOWED_ORIGINS: http://localhost:30300
  NEXT_PUBLIC_API_URL: http://localhost:30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: gopoli
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-gopoli
  namespace: gopoli
  labels:
    app: db-gopoli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-gopoli
  template:
    metadata:
      labels:
        app: db-gopoli
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ghcr.io/gopoli/gopoli-db:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: gopoli-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U gopoli -d gopoli"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U gopoli -d gopoli"]
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db-gopoli
  namespace: gopoli
spec:
  selector:
    app: db-gopoli
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gopoli
  namespace: gopoli
  labels:
    app: api-gopoli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gopoli
  template:
    metadata:
      labels:
        app: api-gopoli
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/gopoli/gopoli-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gopoli-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: POSTGRES_PASSWORD
            - name: GOPOLI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gopoli-secrets
                  key: GOPOLI_JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gopoli
  namespace: gopoli
spec:
  selector:
    app: api-gopoli
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gopoli
  namespace: gopoli
  labels:
    app: web-gopoli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-gopoli
  template:
    metadata:
      labels:
        app: web-gopoli
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/gopoli/gopoli-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: gopoli-config
                  key: NEXT_PUBLIC_API_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next
              mountPath: /app/.next
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-gopoli
  namespace: gopoli
spec:
  selector:
    app: web-gopoli
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-only-from-api
  namespace: gopoli
spec:
  podSelector:
    matchLabels:
      app: db-gopoli
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gopoli
      ports:
        - port: 5432
